
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visualizzatore AR - SM20</title>

  <!-- Libreria ufficiale model-viewer -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #15191e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 18px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
    }

    p {
      color: #c5cbd2;
      font-size: 14px;
      line-height: 1.5;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: #20262d;
      --poster-color: #20262d;
    }

    .controls {
      padding: 18px 15px 25px;
    }

    #launchAR {
      display: inline-block;
      width: 90%;
      max-width: 360px;
      padding: 17px 20px;
      border: 0;
      border-radius: 12px;
      background: #1685ed;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    #launchAR:active {
      background: #0868c4;
      transform: scale(0.98);
    }

    #launchAR.disabled {
      background: #555;
      pointer-events: none;
    }

    #status {
      margin: 15px auto 5px;
      max-width: 500px;
      padding: 0 15px;
      font-size: 14px;
      line-height: 1.5;
      color: #d5dce4;
    }

    #progress {
      width: 85%;
      max-width: 350px;
      height: 5px;
      margin: 12px auto;
      background: #414951;
      border-radius: 5px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #1685ed;
      transition: width 0.2s;
    }

    .instructions {
      padding: 0 20px 20px;
      color: #9faab5;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Visualizzatore 3D - SM20</h1>
    <p>Ruota e ingrandisci il modello sullo schermo.</p>
  </header>

  <!-- Modello 3D -->
  <model-viewer
    id="viewer"
    src="SM20%20BP.glb"
    alt="ASSIEME Model"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    loading="eager"
    touch-action="pan-y">
  </model-viewer>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <div class="controls">

    <!-- Apertura diretta di Google Scene Viewer -->
    <a id="launchAR" href="#">
      APRI IL MODELLO IN AR
    </a>

    <div id="status">
      Caricamento del modello 3D...
    </div>

  </div>

  <div class="instructions">
    Premi il pulsante AR per aprire il visualizzatore Google.
    Una volta aperto, scegli "Vedi nel tuo spazio" se disponibile.
  </div>

  <script>
    const MODEL_FILE = "SM20 BP.glb";

    const viewer = document.getElementById("viewer");
    const arButton = document.getElementById("launchAR");
    const statusText = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");

    // Percorso completo del GLB nella stessa cartella dell'index
    const modelUrl = new URL(
      MODEL_FILE,
      window.location.href
    ).href;

    // URL di ritorno in caso di mancato avvio di Scene Viewer
    const fallbackUrl = new URL(window.location.href);
    fallbackUrl.searchParams.set("ar-fallback", "1");

    // Controlla se siamo su Android
    const isAndroid = /android/i.test(navigator.userAgent);

    // Crea l'intent Android ufficiale per Google Scene Viewer
    const sceneViewerIntent =
      "intent://arvr.google.com/scene-viewer/1.0" +
      "?file=" + encodeURIComponent(modelUrl) +
      "&mode=ar_preferred" +
      "&title=" + encodeURIComponent("ASSIEME Model") +
      "#Intent;" +
      "scheme=https;" +
      "package=com.google.android.googlequicksearchbox;" +
      "action=android.intent.action.VIEW;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(fallbackUrl.href) +
      ";end;";

    // Imposta il pulsante AR
    if (isAndroid) {
      arButton.href = sceneViewerIntent;
      arButton.classList.remove("disabled");
    } else {
      arButton.href = "#";
      arButton.classList.add("disabled");
      arButton.textContent = "APRIRE DA UN DISPOSITIVO ANDROID";
    }

    // Se Google ha effettuato il ritorno alla pagina,
    // mostra un messaggio invece di tentare un nuovo avvio
    const params = new URLSearchParams(window.location.search);

    if (params.get("ar-fallback") === "1") {
      statusText.textContent =
        "Scene Viewer non è riuscito ad avviarsi. " +
        "Controlla che l'app Google e Google Play Services per AR " +
        "siano installati e aggiornati.";
    }

    // Modello caricato correttamente
    viewer.addEventListener("load", function () {
      statusText.textContent =
        "Modello 3D caricato correttamente. Puoi aprirlo in AR.";

      progressBar.style.width = "100%";
    });

    // Avanzamento caricamento
    viewer.addEventListener("progress", function (event) {
      const progress = Math.round(
        event.detail.totalProgress * 100
      );

      progressBar.style.width = progress + "%";

      if (progress < 100) {
        statusText.textContent =
          "Caricamento modello: " + progress + "%";
      }
    });

    // Errore di caricamento del GLB
    viewer.addEventListener("error", function (event) {
      statusText.textContent =
        "ERRORE: impossibile caricare il modello. " +
        "Controlla che il file si chiami esattamente " +
        MODEL_FILE +
        " e che si trovi nella stessa cartella di index.html.";

      console.error("Errore model-viewer:", event);
    });

    // Messaggio iniziale per Android
    if (isAndroid && params.get("ar-fallback") !== "1") {
      statusText.textContent =
        "Attendi il caricamento del modello, poi premi APRI IL MODELLO IN AR.";
    }
  </script>

</body>
</html>
