
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM20 - Test AR diretto</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #15191e;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 { padding: 12px; }

model-viewer {
  width: 100%;
  height: 65vh;
  min-height: 350px;
  background: #20262d;
}

button {
  margin: 20px auto;
  padding: 17px 25px;
  border: 0;
  border-radius: 10px;
  background: #1685ed;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

#status {
  padding: 15px;
  font-size: 15px;
  line-height: 1.5;
}
</style>
</head>

<body>

<h2>SM20 - Realtà aumentata</h2>

<model-viewer
  id="viewer"
  src="./SM20%20BP.glb"
  alt="ASSIEME SM20"
  ar
  ar-modes="webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1">
</model-viewer>

<button id="arButton">PROVA AR DIRETTA</button>

<div id="status">
Caricamento modello...
</div>

<script>
const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const button = document.getElementById("arButton");

viewer.addEventListener("load", () => {
  status.textContent =
    "Modello caricato. Premi PROVA AR DIRETTA.";
});

viewer.addEventListener("error", () => {
  status.textContent =
    "Errore caricamento modello. Controlla il file GLB.";
});

viewer.addEventListener("ar-status", (event) => {
  const s = event.detail.status;

  if (s === "session-started") {
    status.textContent = "AR avviata!";
  } else if (s === "object-placed") {
    status.textContent = "Modello posizionato nell'ambiente.";
  } else if (s === "failed") {
    status.textContent =
      "AR non disponibile su questo browser o dispositivo.";
  } else if (s === "not-presenting") {
    status.textContent = "Sessione AR terminata.";
  }
});

button.addEventListener("click", async () => {
  status.textContent = "Tentativo di avvio AR nel browser...";

  try {
    await viewer.activateAR();
  } catch (error) {
    status.textContent =
      "WebXR non disponibile: " +
      (error.message || "controllare supporto AR del dispositivo");

    console.error(error);
  }
});
</script>

</body>
</html>
